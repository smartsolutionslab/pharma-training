name: board-promote

# Releases issues whose dependencies are done to the board (agent:ready), so agents never take an issue before the
# work it builds on is merged. Hand-written stop-gap until the board protocol knows dependencies
# (smartsolutionslab/software-fabric#849); see .github/scripts/board-promote.sh.
on:
  issues:
    types: [closed]
  schedule:
    # Hourly as well, for dependencies in other repositories, which raise no event here.
    - cron: "41 * * * *"
  workflow_dispatch:

# One run at a time, never cancelled: two runs at once would release an issue twice, and a cancelled run could stop
# between the label and its comment.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/board-promote.sh "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
