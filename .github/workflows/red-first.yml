name: red-first

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# One run per workflow and ref; a newer push or body edit is checked against the latest body and diff, so the run
# before it is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failing-tests-quoted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Source changes quote the tests they made fail first
        # Against the base branch as it is now: the merge ref is built from it, and the event's base.sha can predate
        # commits merged into it since, which would count as this pull request's own (#429). red-first.sh also lets a
        # dependency update by Dependabot through, as the base branch's dependency-update.sh decides.
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          bash .github/scripts/red-first.sh "$RUNNER_TEMP/body.md" "$BASE" HEAD "$AUTHOR"
